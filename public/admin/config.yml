                field:
                  label: Item
                  name: item
                  widget: string
              - label: Number of photos label
                name: count
                widget: string
              - label: Message label
                name: message
                widget: string
              - label: “Required” label
                name: required
                widget: string
              - label: Error messages
                name: errors
                widget: object
                fields:
                  - label: Invalid email
                    name: email
                    widget: string
                  - label: Missing Instagram
                    name: instagram
                    widget: string
                  - label: Missing name
                    name: name
                    widget: string
                  - label: Too few photos
                    name: count
                    widget: string
                  - label: Message too long
