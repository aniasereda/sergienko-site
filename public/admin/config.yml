backend:
  name: github
  repo: aniasereda/sergienko-site
  branch: main
publish_mode: simple
media_folder: public/images
public_folder: /images
collections:
  - name: shared
    label: Home page photos
    files:
      - name: gallery
        label: Photo row at the top of the home page
        format: json
        file: src/content/gallery.json
        fields:
          - label: "Photos (exactly 6 — click a photo to replace it, drag to reorder)"
            name: photos
            widget: list
            min: 6
            max: 6
            fields:
              - label: Photo (tall photos work best, the frame is 2:3)
                name: image
                widget: image
                media_folder: /public/images/portfolio
                public_folder: /images/portfolio
            summary: "{{fields.image}}"
            label_singular: photo
  - name: en
    label: English
    files:
      - name: contacts
        label: Main texts and contacts
        format: json
        file: src/content/en/site.json
        fields:
          - label: Name (big text at the top, shown in capital letters)
            name: name
            widget: string
          - label: Role (italic line under the name)
            name: role
            widget: string
          - label: Tagline (three short phrases, each on its own line under the photos)
            name: tagline
            widget: list
            field:
              label: Item
              name: item
              widget: string
          - label: Directions of work (shown in one line with “ · ” between)
            name: directions
            widget: list
            field:
              label: Item
              name: item
              widget: string
          - label: Minimum number of photos
            name: minPhotos
            widget: number
            value_type: int
            min: 1
          - label: Social links
            name: social
            widget: object
            fields:
              - label: Instagram
                name: instagram
                widget: string
              - label: Facebook
                name: facebook
                widget: string
              - label: LinkedIn
                name: linkedin
                widget: string
          - label: Privacy policy link
            name: privacyUrl
            widget: string
      - name: prices
        label: Prices
        format: json
        file: src/content/en/prices.json
        fields:
          - label: Color correction
            name: color
            widget: list
            fields: &a1
              - label: Name
                name: name
                widget: string
              - label: Price (e.g. $0.40)
                name: price
                widget: string
              - label: Intro paragraph under the price
                name: lead
                widget: text
              - label: Included (one item per line of the list)
                name: included
                widget: list
                field:
                  label: Item
                  name: item
                  widget: string
              - label: Not included (leave empty to hide the block)
                name: notIncluded
                widget: list
                required: false
                field:
                  label: Item
                  name: item
                  widget: string
            summary: "{{fields.name}} — {{fields.price}}"
          - label: Skin retouching
            name: skin
            widget: list
            fields: *a1
            summary: "{{fields.name}} — {{fields.price}}"
          - label: What affects the final price
            name: factors
            widget: text
          - label: Note under the prices (starts with *)
            name: note
            widget: text
      - name: turnaround
        label: Turnaround times
        format: json
        file: src/content/en/turnaround.json
        fields:
          - label: Two columns
            name: groups
            widget: list
            fields:
              - label: Column title
                name: label
                widget: string
              - label: Highlighted column (light background, brown time)
                name: highlight
                widget: boolean
                required: false
              - label: Rows
                name: rows
                widget: list
                fields:
                  - label: Volume (e.g. Up to 300 photos)
                    name: volume
                    widget: string
                  - label: Time (e.g. up to 3 days)
                    name: time
                    widget: string
                summary: "{{fields.volume}} — {{fields.time}}"
            summary: "{{fields.label}}"
            min: 2
            max: 2
          - label: Notes (with check marks)
            name: notes
            widget: list
            field:
              label: Item
              name: item
              widget: string
          - label: Rush orders (dark banner)
            name: rush
            widget: text
      - name: booking
        label: How to book
        format: json
        file: src/content/en/booking.json
        fields:
          - label: Subtitle (intro text under the section title)
            name: subtitle
            widget: string
          - label: Three steps
            name: steps
            widget: list
            min: 3
            max: 3
            summary: "{{fields.title}}"
            fields:
              - label: Title
                name: title
                widget: string
              - label: Text
                name: text
                widget: text
          - label: “Important” block
            name: important
            widget: object
            fields:
              - label: Title
                name: title
                widget: string
              - label: Text
                name: text
                widget: text
              - label: Warning
                name: warning
                widget: text
              - label: Call to action (the word “Direct” / “DM” becomes a link to Instagram)
                name: cta
                widget: string
      - name: steps
        label: How to start (steps)
        format: json
        file: src/content/en/steps.json
        fields:
          - label: Steps
            name: items
            widget: list
            fields:
              - label: Title
                name: title
                widget: string
              - label: Text
                name: text
                widget: text
            summary: "{{fields.title}}"
      - name: ui
        label: Interface texts (titles, buttons, form)
        format: json
        file: src/i18n/ui.en.json
        fields:
          - label: Language code
            name: lang
            widget: hidden
            default: en
          - label: Browser tab and search results
            name: meta
            widget: object
            fields:
              - label: Page title
                name: title
                widget: string
              - label: Page description
                name: description
                widget: text
          - label: Menu
            name: nav
            widget: object
            fields:
              - label: Prices
                name: prices
                widget: string
              - label: Turnaround
                name: terms
                widget: string
              - label: Booking
                name: booking
                widget: string
              - label: How to start
                name: start
                widget: string
              - label: Contact
                name: contact
                widget: string
          - label: Buttons
            name: cta
            widget: object
            fields:
              - label: See prices
                name: prices
                widget: string
              - label: Send a request
                name: request
                widget: string
          - label: Portfolio section
            name: portfolio
            widget: object
            fields:
              - label: Label above the title
                name: eyebrow
                widget: string
              - label: Title
                name: title
