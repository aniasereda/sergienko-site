              - label: “Previous photo” label
                name: prev
                widget: string
              - label: “Next photo” label
                name: next
                widget: string
          - label: Section titles
            name: sections
            widget: object
            fields:
              - label: Prices
                name: prices
                widget: object
                fields:
                  - label: Label above the title
                    name: eyebrow
                    widget: string
                  - label: Title
                    name: title
                    widget: string
                  - label: Color correction heading
                    name: color
                    widget: string
                  - label: Skin retouching heading
                    name: skin
                    widget: string
                  - label: “per photo” text
                    name: perPhoto
                    widget: string
                  - label: “Included” list heading
                    name: included
                    widget: string
                  - label: “Not included” list heading
                    name: notIncluded
                    widget: string
              - label: Turnaround
                name: terms
                widget: object
                fields:
                  - label: Label above the title
                    name: eyebrow
                    widget: string
                  - label: Title
                    name: title
                    widget: string
              - label: Booking
                name: booking
                widget: object
                fields:
                  - label: Label above the title
                    name: eyebrow
                    widget: string
                  - label: Title
                    name: title
                    widget: string
              - label: How to start
                name: start
                widget: object
                fields:
                  - label: Label above the title
                    name: eyebrow
                    widget: string
                  - label: Title
                    name: title
                    widget: string
              - label: Contact
                name: contact
                widget: object
                fields:
                  - label: Label above the title
                    name: eyebrow
                    widget: string
                  - label: Title
                    name: title
                    widget: string
                  - label: Text under the title
                    name: text
                    widget: text
          - label: Contact form
            name: form
            widget: object
            fields:
              - label: Name label
                name: name
                widget: string
              - label: Email label
                name: email
                widget: string
              - label: Instagram label
                name: instagram
                widget: string
              - label: Instagram placeholder
                name: instagramHint
                widget: string
              - label: “I need” label
                name: need
                widget: string
              - label: “I need” options
                name: options
